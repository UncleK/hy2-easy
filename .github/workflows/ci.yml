name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: agent
      - run: npm test
        working-directory: agent
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh && shellcheck install.sh
  agent-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: agent
      - run: docker build -t hy2-easy-test -f tests/Dockerfile .
      - name: Start disposable SSH server on loopback only
        run: |
          docker run -d --name hy2-easy-agent-qa --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock \
            -p 127.0.0.1:22222:22 -p 127.0.0.1:24444:24444/udp hy2-easy-test
          for i in $(seq 1 30); do
            if docker exec hy2-easy-agent-qa systemctl is-active --quiet systemd-tmpfiles-setup.service; then break; fi
            sleep 1
          done
          docker exec hy2-easy-agent-qa systemctl is-active --quiet systemd-tmpfiles-setup.service
          docker exec hy2-easy-agent-qa bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends openssh-server >/dev/null && echo root:hy2-easy-disposable-test | chpasswd && printf "PermitRootLogin yes\nPasswordAuthentication yes\n" > /etc/ssh/sshd_config.d/test-only.conf && systemctl restart ssh'
      - run: node agent/tests/integration.mjs --disposable-container
      - name: Remove disposable server
        if: always()
        run: docker rm -f hy2-easy-agent-qa || true
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            base: debian:12-slim
          - runner: ubuntu-24.04
            base: debian:13-slim
          - runner: ubuntu-24.04
            base: ubuntu:22.04
          - runner: ubuntu-24.04
            base: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            base: debian:12-slim
          - runner: ubuntu-24.04-arm
            base: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable systemd environment
        run: docker build --build-arg 'BASE=${{ matrix.base }}' -t hy2-easy-test -f tests/Dockerfile .
      - name: Boot isolated systemd
        run: |
          docker run -d --name hy2-easy-qa --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock \
            --mount type=bind,source="$PWD",target=/src,readonly hy2-easy-test
          for i in $(seq 1 30); do
            if docker exec hy2-easy-qa systemctl is-active --quiet systemd-tmpfiles-setup.service; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test installation, QR, real tunnel, rejection, restart and removal
        run: docker exec hy2-easy-qa python3 /src/tests/e2e.py --disposable-container
      - name: Clean up
        if: always()
        run: docker rm -f hy2-easy-qa || true
